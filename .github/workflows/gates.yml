# Runs the mechanical gates on every pull request and on every push to main.
name: gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning scripts/*.sh .githooks/pre-commit
      - name: Gates
        run: sh scripts/gates.sh
