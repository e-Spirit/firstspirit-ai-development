# older than expected; scripts/gates.sh runs it (SKIP where no skill is installed).
# toolkit: 0.6.0 or newer
# version: 0.1.0
# written-against: FirstSpirit AI Toolkit 0.7.0; FirstSpirit REST API module 0.0.25-beta; FirstSpirit 5.2.261011
