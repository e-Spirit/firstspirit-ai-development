<div class="rr-modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden data-done="Gebucht! Wir sehen uns am Rhein," data-name-fallback="du">
<div class="rr-modal__panel">
<button class="rr-modal__close" id="m-close" type="button" aria-label="Schließen"><img src="../icons/close.svg" alt="" width="18" height="18"></button>
<div class="rr-modal__head"><span class="rr-card__icon" id="m-icon"></span><span class="rr-badge rr-badge--ink" id="m-status"></span></div>
<h3 id="m-title" style="font-size:2.5rem;margin:var(--rr-space-4) 0 var(--rr-space-2)"></h3>
<p id="m-text" style="font-size:1.1875rem;margin:0"></p>
<div class="rr-modal__facts"><span><img src="../icons/clock.svg" alt=""><span id="m-dur"></span></span><span><img src="../icons/euro.svg" alt=""><span id="m-price"></span></span></div>
<div class="rr-modal__book" id="m-book"><input class="rr-input" id="m-name" placeholder="Dein Name" aria-label="Name"><button class="rr-btn" id="m-go" type="button">Jetzt buchen</button></div>
<div class="rr-modal__done" id="m-done" hidden><img src="../icons/check.svg" alt="" width="28" height="28"><span id="m-done-text"></span></div>
</div></div>
